<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- Background circle with gradient -->
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1c8868;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3a816c;stop-opacity:1" />
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Main logo container -->
    <g transform="translate(100, 100)">

        <!-- Outer circle with gradient -->
        <circle cx="0" cy="0" r="90" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.9"/>

        <!-- Inner white circle -->
        <circle cx="0" cy="0" r="75" fill="white"/>

        <!-- Quran book symbol -->
        <g transform="translate(-25, -20)">
            <!-- Book cover -->
            <rect x="0" y="0" width="50" height="70" rx="5" fill="#1c8868" stroke="#000" stroke-width="2"/>
            <!-- Book pages -->
            <rect x="3" y="3" width="44" height="64" rx="2" fill="#f8f8f8"/>
            <!-- Book spine -->
            <rect x="45" y="5" width="5" height="60" fill="#3a816c"/>
            <!-- Arabic calligraphy lines -->
            <path d="M10 15 Q20 10 30 15 Q40 20 35 25 Q25 30 15 25" stroke="#1c8868" stroke-width="1.5" fill="none"/>
            <path d="M10 30 Q20 25 30 30 Q40 35 35 40 Q25 45 15 40" stroke="#1c8868" stroke-width="1.5" fill="none"/>
            <path d="M10 45 Q20 40 30 45 Q40 50 35 55 Q25 60 15 55" stroke="#1c8868" stroke-width="1.5" fill="none"/>
        </g>

        <!-- Mosque minaret symbol -->
        <g transform="translate(20, -15)">
            <!-- Minaret base -->
            <rect x="0" y="40" width="15" height="30" fill="#3a816c"/>
            <!-- Minaret tower -->
            <rect x="2" y="20" width="11" height="25" fill="#f8f8f8" stroke="#3a816c" stroke-width="2"/>
            <!-- Minaret top -->
            <polygon points="0,20 7.5,10 15,20" fill="#1c8868"/>
            <!-- Minaret balcony -->
            <circle cx="7.5" cy="35" r="4" fill="#3a816c"/>
        </g>

        <!-- Star and crescent symbol -->
        <g transform="translate(-10, 20)">
            <!-- Crescent moon -->
            <path d="M0,0 A15,15 0 0,1 30,0 A15,15 0 0,1 0,0 Z" fill="#f8f8f8" stroke="#1c8868" stroke-width="2"/>
            <!-- Star -->
            <polygon points="15,5 18,15 28,15 20,22 23,32 15,27 7,32 10,22 2,15 12,15" fill="#1c8868"/>
        </g>

        <!-- Arabic text "Quran" in stylized form -->
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1c8868" text-anchor="middle" transform="rotate(-10)">القرآن</text>

        <!-- Decorative border elements -->
        <circle cx="-60" cy="-60" r="3" fill="#1c8868" opacity="0.7"/>
        <circle cx="60" cy="-60" r="3" fill="#1c8868" opacity="0.7"/>
        <circle cx="-60" cy="60" r="3" fill="#1c8868" opacity="0.7"/>
        <circle cx="60" cy="60" r="3" fill="#1c8868" opacity="0.7"/>

    </g>

    <!-- Animation for subtle pulse effect -->
    <style>
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        svg {
            animation: pulse 4s ease-in-out infinite;
            transform-origin: center;
        }
    </style>
</svg>
